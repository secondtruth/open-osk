name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Smoke test
        run: |
          .build/debug/openosk --version
          # The full --smoke-test needs a window server; keep CI headless-safe.

  linux-core:
    name: Linux core build
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build OpenOSKCore
        run: swift build --target OpenOSKCore
